<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GS Coffee | Avaliações</title>

    <link rel="stylesheet" href="styles/admin.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f6ebdd;
            color: #3a2014;
            margin: 0;
        }

        .panel {
            width: min(1000px, calc(100% - 30px));
            margin: 40px auto;
        }

        .card {
            background: #fff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px #3a201414;
            margin-bottom: 25px;
        }

        h1,
        h2 {
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            gap: 15px;
        }

        label {
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #d7c1af;
            border-radius: 10px;
            font-size: 15px;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            background: #603319;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #b87945;
        }

        .voltar {
            display: inline-block;
            margin-bottom: 20px;
            color: #603319;
            text-decoration: none;
            font-weight: bold;
        }

        .avaliacao-item {
            border-bottom: 1px solid #ead9cc;
            padding: 18px 0;
        }

        .avaliacao-item:last-child {
            border-bottom: none;
        }

        .estrelas {
            color: #b87945;
            font-size: 20px;
        }

        .avaliacao-item p {
            margin: 8px 0;
        }

        .avaliacao-acoes {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.mensagem-sucesso {
    margin: 12px 0 0;
    padding: 0;
    background: transparent;
    color: #17803d;
    font-size: 14px;
    font-weight: 500;
}

.btn-editar {
    background: #603319;
}

.btn-excluir {
    background: #9b2c2c;
}

.btn-excluir:hover {
    background: #c0392b;
}

.modal-excluir {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.45);
    z-index: 9999;

    align-items: center;
    justify-content: center;
}

.modal-excluir.ativo {
    display: flex;
}

.modal-excluir-conteudo {
    width: 360px;
    max-width: 90%;

    background: white;

    padding: 28px;

    border-radius: 14px;

    text-align: center;

    box-sizing: border-box;

    box-shadow:
        0 10px 35px
        rgba(0, 0, 0, 0.25);
}

.modal-excluir-conteudo h3 {
    margin-top: 0;
    margin-bottom: 10px;
}

.modal-excluir-conteudo p {
    margin: 0;
}

.modal-excluir-acoes {
    display: flex;

    justify-content: center;

    gap: 12px;

    margin-top: 22px;
}

.btn-cancelar,
.btn-confirmar-exclusao {
    width: auto;
    padding: 10px 22px;
}

.btn-cancelar {
    background: #777;
}

.btn-cancelar:hover {
    background: #555;
}

.btn-confirmar-exclusao {
    background: #9b2c2c;
}

.btn-confirmar-exclusao:hover {
    background: #c0392b;
}
    </style>
</head>

<body>

    <main class="panel">

        <a
            href="dashboard.html"
            class="voltar"
        >
            ← Voltar para o painel
        </a>


        <section class="card">

            <h1>⭐ Avaliações</h1>

            <p>
                Cadastre avaliações para exibir na página principal da GS Coffee.
            </p>


            <form id="avaliacaoForm" class="form-grid">

                <div>
                    <label for="nome_avaliador">
                        Nome do avaliador
                    </label>

                    <input
                        type="text"
                        id="nome_avaliador"
                        required
                    >
                </div>


                <div>
                    <label for="nota">
                        Nota
                    </label>

                    <select id="nota" required>

    <option value="">
        Selecione
    </option>

    <option value="5">
        ⭐⭐⭐⭐⭐ - 5 estrelas
    </option>

    <option value="4">
        ⭐⭐⭐⭐☆ - 4 estrelas
    </option>

    <option value="3">
        ⭐⭐⭐☆☆ - 3 estrelas
    </option>

    <option value="2">
        ⭐⭐☆☆☆ - 2 estrelas
    </option>

    <option value="1">
        ⭐☆☆☆☆ - 1 estrela
    </option>

</select>
                </div>


                <div>
                    <label for="comentario">
                        Comentário
                    </label>

                    <textarea
                        id="comentario"
                        maxlength="150"
                        required
                    ></textarea>

                    <small id="contadorAvaliacao">
    0/150
</small>

                </div>

                <button type="submit">
                    Salvar avaliação
                </button>

            </form>

        </section>


        <section class="card">

            <h2>
                Avaliações cadastradas
            </h2>

            <div id="listaAvaliacoes">

                <p>
                    Carregando avaliações...
                </p>

            </div>

        </section>

    </main>

    <div id="modalExcluir" class="modal-excluir">
  <div class="modal-excluir-conteudo">

    <h3>Excluir avaliação</h3>

    <p>
      Tem certeza que deseja excluir esta avaliação?
    </p>

    <div class="modal-excluir-acoes">
      <button
        type="button"
        id="cancelarExclusao"
        class="btn-cancelar"
      >
        Cancelar
      </button>

      <button
        type="button"
        id="confirmarExclusao"
        class="btn-confirmar-exclusao"
      >
        Excluir
      </button>
    </div>

  </div>
</div>

    <script src="scripts/avaliacoes.js"></script>

</body>

</html>
