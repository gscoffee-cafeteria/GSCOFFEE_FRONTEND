<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GS Coffee | Administração</title>

    <link rel="stylesheet" href="styles/admin.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="logo-area">
                <div class="coffee-icon">☕</div>

                <h1>GS Coffee</h1>

                <p>Painel Administrativo</p>
            </div>


            <form id="loginForm">

                <div class="input-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Entrar
                </button>


                <p
                    id="loginMessage"
                    class="login-message"
                ></p>

            </form>


            <a
                href="../index.html"
                class="back-link"
            >
                ← Voltar para a cafeteria
            </a>

        </section>

    </main>


    <script src="scripts/login.js"></script>

</body>

</html>
